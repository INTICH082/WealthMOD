name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: gradle build --stacktrace

      # Requires a MODRINTH_TOKEN repo secret and a real projectId in build.gradle.
      # Skips silently if the secret isn't set, so this workflow still works
      # for forks/repos that only want the GitHub release below.
      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: gradle modrinth --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true